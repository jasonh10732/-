name: 部署到 GitHub Pages

# 每次推到這個分支就自動部署；也可以在 Actions 頁手動觸發
on:
  push:
    branches: [claude/github-mobile-connection-j8v34v]
  workflow_dispatch:

# 給這次工作流程部署 Pages 所需的權限
permissions:
  contents: read
  pages: write
  id-token: write

# 同時間只跑一個部署，避免互相打架
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 取出程式碼
        uses: actions/checkout@v4

      - name: 啟用並設定 Pages（第一次會自動幫你開啟）
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: 打包整個網站（根目錄）
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: 部署到 Pages
        id: deployment
        uses: actions/deploy-pages@v4
